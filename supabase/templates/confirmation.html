<!doctype html>
<html lang="hu">
  <body style="margin:0;padding:0;background:#13100d;font-family:Arial,Helvetica,sans-serif;color:#f2ebe1">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#13100d;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#1c1814;border:1px solid #332c25;border-radius:12px;padding:28px">
            <tr>
              <td style="font-size:22px;font-weight:bold;letter-spacing:3px;color:#d4a95e;padding-bottom:20px">CHAIRTIME</td>
            </tr>
            <tr>
              <td style="font-size:20px;font-weight:bold;padding-bottom:12px">Üdv a ChairTime-ban!</td>
            </tr>
            <tr>
              <td style="font-size:15px;line-height:1.5;color:#a89d90;padding-bottom:24px">
                Már csak egy lépés: erősítsd meg az e-mail-címedet, és máris foglalhatsz időpontot a barberednél.
              </td>
            </tr>
            <tr>
              <td style="padding-bottom:24px">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
                   style="display:inline-block;background:#d4a95e;color:#13100d;font-weight:bold;text-decoration:none;padding:14px 22px;border-radius:8px">
                  Megerősítem
                </a>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:1.5;color:#a89d90">
                Ha nem te regisztráltál, hagyd figyelmen kívül ezt a levelet.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
